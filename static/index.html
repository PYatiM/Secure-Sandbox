<!DOCTYPE html>
<html>
<head>
    <title>Secure Sandbox</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>Secure Code Execution Sandbox</h1>

        <div id="editor" style="height:300px;"></div>
        <h3>Input</h3>
        <textarea id="stdinInput" placeholder="Enter input here..."></textarea>
        <button onclick="runCode()">Execute</button>
        <div id="status" class="status idle">Idle</div>
        <div class="output">
            <h3>Output</h3>
            <pre id="stdout"></pre>

            <h3>Execution History</h3>
            <ul id="history"></ul>

            <h3>Error</h3>
            <pre id="stderr"></pre>

            <h3>Metadata</h3>
            <pre id="meta"></pre>
        </div>
    </div>
    
    <script src="https://unpkg.com/monaco-editor@0.44.0/min/vs/loader.js"></script>
    <script src="/static/script.js"></script>
    
</body>
</html>
